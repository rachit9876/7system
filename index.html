<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="7System is a fast, offline-first mind mapping and note-taking tool.">
    <title>7System</title>
    <link rel="icon" type="image/png" href="assets/mapMind.png">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        // Apply the saved theme before first paint (defaults to Dark Mode).
        try {
            var savedTheme = localStorage.getItem('mindmap-theme');
            if (savedTheme !== 'light') {
                document.documentElement.classList.add('dark');
            }
        } catch (e) {}

        // Redirect small screens to the mobile feed page.
        if (window.matchMedia && window.matchMedia('(max-width: 900px)').matches) {
            window.location.replace('mobile.html');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Mermaid comes from a CDN; guard so a blocked CDN cannot throw.
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'default' });
            }
        });
    </script>
</head>
<body class="flex flex-col h-screen">
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Undo -->
  <symbol id="icon-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14l-4-4m0 0l4-4m-4 4h12.5a5.5 5.5 0 0 1 0 11H13"/>
  </symbol>
  <!-- Redo -->
  <symbol id="icon-redo" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 14l4-4m0 0l-4-4m4 4H6.5a5.5 5.5 0 0 0 0 11H11"/>
  </symbol>
  <!-- Add/Plus -->
  <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
  </symbol>
  <!-- Trash -->
  <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
  </symbol>
  <!-- New File -->
  <symbol id="icon-new-file" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
  </symbol>
  <!-- Lock Unlocked -->
  <symbol id="icon-lock-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11h8m-8 0V7a4 4 0 0 1 4-4 4 4 0 0 1 4 4m-8 4v0m0 0H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-2M12 15v2"/>
  </symbol>
  <!-- Lock Locked -->
  <symbol id="icon-lock-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z"/>
  </symbol>
  <!-- Minus -->
  <symbol id="icon-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/>
  </symbol>
  <!-- Fit View -->
  <symbol id="icon-fit-view" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4h4m12 4V4h-4M4 16v4h4m12-4v4h-4"/>
  </symbol>
  <!-- Import -->
  <symbol id="icon-import" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 16v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3M12 3v12m0 0l-4-4m4 4l4-4"/>
  </symbol>
  <!-- Export -->
  <symbol id="icon-export" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 16v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3M12 12V3m0 0L8 7m4-4l4 4"/>
  </symbol>
  <!-- Cloud Upload -->
  <symbol id="icon-cloud-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
  </symbol>
  <!-- Cloud Download -->
  <symbol id="icon-cloud-download" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 11l3 3m0 0l3-3m-3 3V4"/>
  </symbol>
  <!-- Markdown Off -->
  <symbol id="icon-markdown-off" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l-3 3 3 3m8-6l3 3-3 3M13 5L11 19"/>
  </symbol>
  <!-- Markdown On -->
  <symbol id="icon-markdown-on" viewBox="0 0 24 24" fill="currentColor">
    <path d="M3 5h2v14H3V5zm4 0h2v14H7V5zm4 0h4v2h-4V5zm0 4h4v2h-4V9zm0 4h4v2h-4v-2zm6-8h2v14h-2V5z"/>
  </symbol>
  <!-- Sun -->
  <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z"/>
  </symbol>
  <!-- Moon -->
  <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 0 1 8.646 3.646 9.003 9.003 0 0 0 12 21a9.003 9.003 0 0 0 8.354-5.646z"/>
  </symbol>
  <!-- Eye -->
  <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
  </symbol>
  <!-- Check -->
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
  </symbol>
  <!-- X -->
  <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
  </symbol>
  <!-- Info -->
  <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
  </symbol>
  <!-- Grid -->
  <symbol id="icon-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 4v16M12 4v16M18 4v16"/>
  </symbol>
  <!-- User/Account -->
  <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z"/>
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 21v-2a4 4 0 00-4-4H10a4 4 0 00-4 4v2"/>
  </symbol>
  <!-- Dashboard/Portal -->
  <symbol id="icon-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
  </symbol>
  <!-- Copy MD -->
  <symbol id="icon-copy-md" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <rect x="2" y="4" width="20" height="16" rx="2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 15V9l2.5 2.5L11 9v6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 15V9m-2 2l2-2 2 2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <!-- Paste MD -->
  <symbol id="icon-paste-md" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <rect x="2" y="4" width="20" height="16" rx="2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 15V9l2.5 2.5L11 9v6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 9v6m-2-2l2 2 2-2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

    <header class="pointer-events-none fixed top-0 left-0 right-0 p-3 flex justify-between items-center z-20">
        <div class="header-left pointer-events-auto flex items-center gap-1 p-1.5 bg-[var(--bg-secondary)]/90 backdrop-blur-xl border border-[var(--border)] rounded-xl shadow-md">
            <button id="importBtn" class="btn btn-secondary" title="Import JSON (Ctrl+O)" aria-label="Import JSON">
                <svg class="w-4 h-4"><use href="#icon-import"/></svg>
            </button>
            <button id="exportBtn" class="btn btn-secondary" title="Export JSON" aria-label="Export JSON">
                <svg class="w-4 h-4"><use href="#icon-export"/></svg>
            </button>
            <div class="h-5 w-px bg-[var(--border)] mx-0.5"></div>
            <button id="importMdBtn" class="btn btn-secondary" title="Paste Markdown Tree" aria-label="Paste Markdown">
                <svg class="w-4 h-4"><use href="#icon-paste-md"/></svg>
            </button>
            <button id="exportMdBtn" class="btn btn-secondary" title="Copy as Markdown Tree" aria-label="Copy Markdown">
                <svg class="w-4 h-4"><use href="#icon-copy-md"/></svg>
            </button>
        </div>
        <div class="toolbar-center pointer-events-auto flex items-center gap-1 p-1.5 bg-[var(--bg-secondary)]/90 backdrop-blur-xl border border-[var(--border)] rounded-xl shadow-md">
            <button id="undoBtn" class="btn btn-secondary" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
                <svg class="w-4 h-4"><use href="#icon-undo"/></svg>
            </button>
            <button id="redoBtn" class="btn btn-secondary" title="Redo (Ctrl+Y / Ctrl+Shift+Z)" aria-label="Redo" disabled>
                <svg class="w-4 h-4"><use href="#icon-redo"/></svg>
            </button>
            <div class="w-px h-5 bg-[var(--border)] mx-0.5"></div>
            <button id="newCanvasBtn" class="btn btn-secondary" title="New Canvas" aria-label="New Canvas">
                <svg class="w-4 h-4"><use href="#icon-new-file"/></svg>
            </button>
            <button id="addNodeBtn" class="btn btn-primary" title="Add Node" aria-label="Add Node">
                <svg class="w-5 h-5"><use href="#icon-plus"/></svg>
            </button>

            <div class="w-px h-5 bg-[var(--border)] mx-0.5"></div>
            <button id="lockBtn" class="btn btn-secondary" title="Lock Nodes" aria-label="Lock Nodes">
                <svg id="lock-icon-unlocked" class="w-4 h-4"><use href="#icon-lock-unlocked"/></svg>
                <svg id="lock-icon-locked" class="w-4 h-4 hidden"><use href="#icon-lock-locked"/></svg>
            </button>
            <button id="zoomOutBtn" class="btn btn-secondary" title="Zoom Out (-)" aria-label="Zoom Out">
                <svg class="w-4 h-4"><use href="#icon-minus"/></svg>
            </button>
            <button id="zoomIndicator" class="text-xs font-semibold w-12 h-8 flex items-center justify-center rounded-md hover:bg-[var(--surface-muted)] cursor-pointer transition-colors" title="Click to reset zoom to 100%">100%</button>
            <button id="zoomInBtn" class="btn btn-secondary" title="Zoom In (+)" aria-label="Zoom In">
                <svg class="w-4 h-4"><use href="#icon-plus"/></svg>
            </button>
            <div class="w-px h-5 bg-[var(--border)] mx-0.5"></div>
            <button id="fitViewBtn" class="btn btn-secondary" title="Fit to View" aria-label="Fit to View">
                <svg class="w-4 h-4"><use href="#icon-fit-view"/></svg>
            </button>
            <button id="autoLayoutBtn" class="btn btn-secondary" title="Auto-Arrange Tree (Ctrl+Shift+L)" aria-label="Auto-Arrange Tree">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h5v4H4V6zm11-2h5v4h-5V4zm0 12h5v4h-5v-4zM9 8h3v10h3M12 6h3"/></svg>
            </button>
            <button id="gridToggle" class="btn btn-secondary" title="Toggle Grid" aria-label="Toggle Grid">
                <svg class="w-4 h-4"><use href="#icon-grid"/></svg>
            </button>
        </div>

        <div class="header-right pointer-events-auto flex items-center gap-1 p-1.5 bg-[var(--bg-secondary)]/90 backdrop-blur-xl border border-[var(--border)] rounded-xl shadow-md">
            <button id="accountBtn" class="btn btn-secondary" title="Account" aria-label="Account">
                <svg class="w-4 h-4"><use href="#icon-user"/></svg>
            </button>
            <a href="portal.html" id="portalBtn" class="btn btn-secondary hidden" title="Dashboard/Portal" aria-label="Dashboard">
                <svg class="w-4 h-4"><use href="#icon-dashboard"/></svg>
            </a>
            <button id="logoutBtn" class="btn btn-secondary hidden" title="Logout" aria-label="Logout">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
            <button id="cloudSaveBtn" class="btn btn-secondary hidden" title="Save to Cloud" aria-label="Save to Cloud">
                <svg class="w-4 h-4"><use href="#icon-cloud-upload"/></svg>
            </button>
            <button id="cloudLoadBtn" class="btn btn-secondary hidden" title="Load from Cloud" aria-label="Load from Cloud">
                <svg class="w-4 h-4"><use href="#icon-cloud-download"/></svg>
            </button>
            <button id="themeToggle" class="btn btn-secondary" title="Toggle Theme" aria-label="Toggle Theme">
                <svg id="theme-icon-light" class="w-4 h-4"><use href="#icon-sun"/></svg>
                <svg id="theme-icon-dark" class="w-4 h-4 hidden"><use href="#icon-moon"/></svg>
            </button>
        </div>
    </header>

    <main class="flex-1 relative">
    <canvas id="mindMapCanvas"></canvas>
    <div id="canvasSearchBar" class="hidden absolute top-3 right-3 z-20 flex items-center gap-2 bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg shadow-lg p-2">
        <input type="text" id="canvasSearchInput" class="px-2 py-1 text-sm border border-[var(--border)] rounded bg-[var(--bg)] text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--accent)] w-48" placeholder="Find node (Ctrl+F)...">
        <span id="canvasSearchCount" class="text-xs text-[var(--text-secondary)] min-w-[3rem] text-center">0/0</span>
        <button id="canvasSearchPrev" class="btn btn-secondary px-2 py-1 text-xs" title="Previous (Shift+Enter)" aria-label="Previous match">&uarr;</button>
        <button id="canvasSearchNext" class="btn btn-secondary px-2 py-1 text-xs" title="Next (Enter)" aria-label="Next match">&darr;</button>
        <button id="canvasSearchClose" class="btn btn-secondary px-2 py-1 text-xs" title="Close (Esc)" aria-label="Close search">&times;</button>
    </div>
    </main>

    <div id="context-menu" class="absolute hidden z-30 rounded-lg shadow-lg w-48">
        <ul class="py-1">
            <li id="menu-add-child" class="px-4 py-2 cursor-pointer">Add Child</li>
            <li id="menu-add-node" class="px-4 py-2 cursor-pointer">Add Node</li>
            <li id="menu-connect" class="px-4 py-2 cursor-pointer">Connect</li>
            <li id="menu-delete-node" class="px-4 py-2 cursor-pointer">Delete Node</li>
            <li id="menu-disconnect" class="px-4 py-2 cursor-pointer">Disconnect</li>
        </ul>
    </div>
    
    <input type="file" id="file-input" class="hidden" accept=".json">

    <!-- Rich Node Editor Modal -->
    <div id="nodeEditorModal" role="dialog" aria-modal="true" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="node-editor-card">
            <div class="node-editor-bar">
                <div class="flex flex-wrap items-center gap-1" id="nodeEditorToolbar">
                    <button type="button" data-md="bold" class="px-2 py-1 text-xs font-bold rounded border border-[var(--border)] hover:bg-[var(--surface-muted)]" title="Bold (**text**)">B</button>
                    <button type="button" data-md="italic" class="px-2 py-1 text-xs italic rounded border border-[var(--border)] hover:bg-[var(--surface-muted)]" title="Italic (*text*)">I</button>
                    <button type="button" data-md="strike" class="px-2 py-1 text-xs line-through rounded border border-[var(--border)] hover:bg-[var(--surface-muted)]" title="Strikethrough (~~text~~)">S</button>
                    <span class="w-px h-4 bg-[var(--border)] mx-1"></span>
                    <button type="button" data-md="h1" class="px-2 py-1 text-xs font-semibold rounded border border-[var(--border)] hover:bg-[var(--surface-muted)]" title="Heading 1">H1</button>
                    <button type="button" data-md="h2" class="px-2 py-1 text-xs font-semibold rounded border border-[var(--border)] hover:bg-[var(--surface-muted)]" title="Heading 2">H2</button>
                    <span class="w-px h-4 bg-[var(--border)] mx-1"></span>
                    <button type="button" data-md="code" class="px-2 py-1 text-xs font-mono rounded border border-[var(--border)] hover:bg-[var(--surface-muted)]" title="Inline Code (`code`)">&lt;/&gt;</button>
                    <button type="button" data-md="link" class="px-2 py-1 text-xs rounded border border-[var(--border)] hover:bg-[var(--surface-muted)]" title="Link ([label](url))">Link</button>
                    <button type="button" data-md="list" class="px-2 py-1 text-xs rounded border border-[var(--border)] hover:bg-[var(--surface-muted)]" title="Bullet List">- List</button>
                    <button type="button" data-md="task" class="px-2 py-1 text-xs rounded border border-[var(--border)] hover:bg-[var(--surface-muted)]" title="Task List">[ ] Task</button>
                    <button type="button" data-md="table" class="px-2 py-1 text-xs rounded border border-[var(--border)] hover:bg-[var(--surface-muted)]" title="Insert Table">Table</button>
                    <button type="button" data-md="mermaid" class="px-2 py-1 text-xs rounded border border-[var(--border)] hover:bg-[var(--surface-muted)]" title="Insert Mermaid Diagram">Diagram</button>
                </div>
            </div>
            <div class="p-4">
                <textarea id="node-editor" rows="12" class="w-full p-3 text-sm leading-relaxed outline-none bg-[var(--bg)] border border-[var(--border)] text-[var(--text-primary)] rounded-lg resize-y focus:ring-2 focus:ring-[var(--accent)]" placeholder="Write Markdown, lists, tables, or ```mermaid diagrams..."></textarea>
            </div>
            <div class="node-editor-footer">
                <span class="text-xs text-[var(--text-secondary)]">Shift+Enter to save · Esc to cancel</span>
                <div class="flex gap-2">
                    <button type="button" id="nodeEditorCancelBtn" class="px-3 py-1.5 text-sm border border-[var(--border)] rounded-lg hover:bg-[var(--surface-muted)] transition-colors">Cancel</button>
                    <button type="button" id="nodeEditorDoneBtn" class="px-4 py-1.5 text-sm bg-[var(--accent)] text-white rounded-lg hover:bg-[var(--accent-hover)] transition-colors font-medium">Done</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Account Login/Register Modal -->
    <div id="accountModal" role="dialog" aria-modal="true" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg p-6 w-96 max-w-md mx-4">
            <h3 class="text-lg font-semibold mb-4">Account</h3>
            <form onsubmit="event.preventDefault();">
                <div class="mb-4">
                    <label for="accountUsernameInput" class="block text-sm font-medium mb-2">Email:</label>
                    <input type="email" id="accountUsernameInput" autocomplete="email" class="w-full px-3 py-2 border border-[var(--border)] rounded-lg bg-[var(--bg)] text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]" placeholder="Enter email address">
                </div>
                <div class="mb-4">
                    <label for="accountPasswordInput" class="block text-sm font-medium mb-2">Password:</label>
                    <input type="password" id="accountPasswordInput" autocomplete="current-password" class="w-full px-3 py-2 border border-[var(--border)] rounded-lg bg-[var(--bg)] text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]" placeholder="Enter password">
                </div>
                <div id="accountStatus" class="text-sm text-[var(--text-secondary)] mb-4 hidden"></div>
                <div class="flex gap-2 justify-end">
                    <button type="button" id="accountCancel" class="px-4 py-2 border border-[var(--border)] rounded-lg hover:bg-[var(--border)] transition-colors">Cancel</button>
                    <button type="submit" id="accountLogin" class="px-4 py-2 bg-[var(--accent)] text-white rounded-lg hover:bg-[var(--accent-hover)] transition-colors">Login / Register</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Cloud Save/Load Modal -->
    <div id="cloudModal" role="dialog" aria-modal="true" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg p-6 w-96 max-w-md mx-4 max-h-[90vh] flex flex-col">
            <h3 id="modalTitle" class="text-lg font-semibold mb-4">Save to Cloud</h3>
            <div class="mb-4">
                <label for="mindmapNameInput" class="block text-sm font-medium mb-2">Mind Map Name:</label>
                <input type="text" id="mindmapNameInput" class="w-full px-3 py-2 border border-[var(--border)] rounded-lg bg-[var(--bg)] text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]" placeholder="Enter mind map name">
            </div>
            <div id="cloudModalExistingListContainer" class="mb-4 hidden flex-1 min-h-[100px] overflow-y-auto border border-[var(--border)] rounded-lg p-2">
                <div class="text-xs font-medium mb-2 text-[var(--text-secondary)] uppercase tracking-wider">Existing Maps (Click to overwrite)</div>
                <div id="cloudModalExistingList" class="space-y-1"></div>
            </div>
            <div class="flex gap-2 justify-end mt-auto">
                <button id="modalCancel" class="px-4 py-2 border border-[var(--border)] rounded-lg hover:bg-[var(--border)] transition-colors">Cancel</button>
                <button id="modalConfirm" class="px-4 py-2 bg-[var(--accent)] text-white rounded-lg hover:bg-[var(--accent-hover)] transition-colors">Save</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" role="dialog" aria-modal="true" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg p-6 w-96 max-w-md mx-4">
            <h3 id="confirmModalTitle" class="text-lg font-semibold mb-4">Confirm</h3>
            <p id="confirmModalMessage" class="text-sm text-[var(--text-secondary)] mb-4"></p>
            <div class="flex gap-2 justify-end">
                <button id="confirmModalCancel" class="hidden px-4 py-2 border border-[var(--border)] rounded-lg hover:bg-[var(--border)] transition-colors">Cancel</button>
                <button id="confirmModalNo" class="px-4 py-2 border border-[var(--border)] rounded-lg hover:bg-[var(--border)] transition-colors">No</button>
                <button id="confirmModalYes" class="px-4 py-2 bg-[var(--accent)] text-white rounded-lg hover:bg-[var(--accent-hover)] transition-colors">Yes</button>
            </div>
        </div>
    </div>

    <!-- Project List Modal -->
    <div id="projectListModal" role="dialog" aria-modal="true" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg p-6 w-96 max-w-md mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold">Your Mind Maps</h3>
                <button id="projectListClose" class="text-[var(--text-secondary)] hover:text-[var(--text-primary)]">
                    <svg class="w-5 h-5"><use href="#icon-x"/></svg>
                </button>
            </div>
            <div id="projectListContent" class="max-h-96 overflow-y-auto border border-[var(--border)] rounded-lg bg-[var(--bg)] p-2">
                <!-- Project list will be populated here -->
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="notification" class="fixed bottom-4 right-4 bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg shadow-lg p-4 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300 z-50 max-w-md">
        <div class="flex items-start">
            <div id="notificationIcon" class="mr-3 mt-0.5">
                <!-- Icon will be inserted here -->
            </div>
            <div>
                <h4 id="notificationTitle" class="font-semibold"></h4>
                <p id="notificationMessage" class="text-sm text-[var(--text-secondary)]"></p>
            </div>
        </div>
    </div>

    <script type="module" src="js/api.js?v=10"></script>
    <script type="module" src="js/editor.js?v=10"></script>
</body>
</html>
